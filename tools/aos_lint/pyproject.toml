[project]
name = "aos-lint"
version = "0.1.0"
description = "Repo-side build tooling for the aos kit: the RFC-002 tier-1 lint, the standalone gates, and the golden-render machinery. Not shipped — this is the kit's CI, not a capability."
# >=3.10 to match the shipped tool it imports from (aos-cap), so one interpreter runs both.
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "aos-cap"]

# The whole point of the port: name computation, the manifest vocabulary and the slot
# regexes are IMPORTED from the shipped tool rather than mirrored here. tools/lib/
# skill-names.mjs used to say its computation "must agree" with aos_cap's, with nothing
# testing the agreement — so there is now one implementation instead of two and a promise.
[tool.uv.sources]
aos-cap = { path = "../../capabilities/capability-lifecycle/tool", editable = true }

[project.scripts]
aos-lint = "aos_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aos_lint"]
