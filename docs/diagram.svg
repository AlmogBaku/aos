<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#001F5C"/>
    </marker>
    <style>
      .tier-label { font-size: 11px; font-weight: 700; fill: #001F5C; letter-spacing: 0.8px; }
      .atomic     { font-size: 10px; font-style: italic; fill: #8A6D00; }
      .box   { rx: 8; ry: 8; stroke-width: 1.4; }
      .atom  { fill: #F2F7FF; stroke: #5B84C4; }
      .mol   { fill: #FFF3E0; stroke: #B07300; }
      .org   { fill: #EEF3FF; stroke: #001F5C; }
      .mod   { fill: #FCE9EF; stroke: #A61E4D; }
      .home  { fill: #F5F1FA; stroke: #5B3E8E; }
      .cell  { fill: #FFFFFF; stroke: #5B3E8E; stroke-width: 1; }
      .adapt { fill: #E8F5E9; stroke: #1B5E20; }
      .page  { fill: #001F5C; }
      .box-t { font-size: 12px; fill: #111; text-anchor: middle; font-weight: 600; }
      .caption { font-size: 10px; fill: #555; text-anchor: middle; }
      .flow  { stroke: #001F5C; stroke-width: 1.2; fill: none; opacity: 0.5; }
      .side  { font-size: 10px; fill: #1B5E20; }
    </style>
  </defs>

  <!-- Tier: use-case capabilities -->
  <text class="tier-label" x="30" y="34">USE-CASE CAPABILITIES <tspan class="atomic"></tspan></text>
  <g>
    <rect class="box org" x="30"  y="46" width="150" height="46"/><text class="box-t" x="105" y="70">Work tracker</text><text class="caption" x="105" y="84">capture · schedule · steward</text>
    <rect class="box org" x="192" y="46" width="128" height="46"/><text class="box-t" x="256" y="74">News tracker</text>
    <rect class="box org" x="332" y="46" width="138" height="46"/><text class="box-t" x="401" y="74">Personal trainer</text>
    <rect class="box org" x="482" y="46" width="90" height="46"/><text class="box-t" x="527" y="74">…</text>
  </g>

  <!-- Tier: infrastructure capabilities -->
  <text class="tier-label" x="30" y="140">INFRASTRUCTURE CAPABILITIES <tspan class="atomic"></tspan></text>
  <g>
    <rect class="box mol" x="30"  y="152" width="150" height="54"/><text class="box-t" x="105" y="176">Knowledge base</text><text class="caption" x="105" y="192">registry · router · authz</text>
    <rect class="box mol" x="195" y="152" width="210" height="54"/><text class="box-t" x="300" y="176">Capability lifecycle</text><text class="caption" x="300" y="192">install · upgrade · onboard · build · evolve</text>
    <rect class="box mol" x="420" y="152" width="120" height="54"/><text class="box-t" x="480" y="176">PTT mode</text><text class="caption" x="480" y="192">voice.stt/tts</text>
    <rect class="box mol" x="555" y="152" width="140" height="54"/><text class="box-t" x="625" y="176">Interviewing</text><text class="caption" x="625" y="192">structured sessions</text>
  </g>

  <!-- Tier: atoms -->
  <text class="tier-label" x="30" y="252">SKILLS <tspan class="atomic">· Agent Skills spec (SKILL.md) — the portable core</tspan></text>
  <rect class="box atom" x="30" y="264" width="730" height="34"/>
  <text class="caption" x="395" y="286">kb-capture · kb-recall · wt-capture · wt-schedule · capability-install · capability-review · …</text>

  <!-- Side: MOD.md (templates) -->
  <g>
    <text class="tier-label" x="790" y="34">OVERLAY <tspan class="atomic">· your answers, in your own repo</tspan></text>
    <rect class="box mod" x="790" y="46" width="140" height="252"/>
    <text class="box-t" x="860" y="74">MOD.md</text>
    <text class="caption" x="860" y="94">user-owned, in personal/</text>
    <text class="caption" x="860" y="118">global MOD.md</text>
    <text class="caption" x="860" y="134">kb-registry.yaml</text>
    <text class="caption" x="860" y="150">capabilities/*/MOD.md</text>
    <text class="caption" x="860" y="182">upstream NEVER</text>
    <text class="caption" x="860" y="196">writes here</text>
    <text class="caption" x="860" y="228">capability-onboard</text>
    <text class="caption" x="860" y="242">writes ONLY here</text>
    <text class="caption" x="860" y="274">survives git pull</text>
    <text class="caption" x="860" y="288">by construction</text>
  </g>

  <!-- The household -->
  <text class="tier-label" x="30" y="328">THE HOUSEHOLD <tspan class="atomic">· ~/aos · one directory: the kit, your instance, machine state</tspan></text>
  <rect class="box home" x="30" y="340" width="900" height="86"/>
  <g>
    <rect class="box cell" x="44"  y="356" width="196" height="54"/><text class="box-t" x="142" y="378">upstream/</text><text class="caption" x="142" y="396">the kit clone · pristine</text>
    <rect class="box cell" x="252" y="356" width="286" height="54"/><text class="box-t" x="395" y="378">personal/</text><text class="caption" x="395" y="396">your repo: MOD.md · pinned renders · your capabilities</text>
    <rect class="box cell" x="550" y="356" width="168" height="54"/><text class="box-t" x="634" y="378">vendor/</text><text class="caption" x="634" y="396">referenced third-party skills</text>
    <rect class="box cell" x="730" y="356" width="186" height="54"/><text class="box-t" x="823" y="378">.aos/</text><text class="caption" x="823" y="396">machine-local · lockfile · principals</text>
  </g>

  <!-- Transform band -->
  <text class="tier-label" x="30" y="456">AGENTIC INSTALL · install = LLM( capability × MOD.md × cheat-sheet ) · upgrade = re-render, your MOD re-applied</text>
  <rect class="box adapt" x="30" y="468" width="900" height="100"/>
  <text class="box-t" x="480" y="490" font-size="13">Per-harness cheat-sheets — knowledge, not code</text>
  <text class="caption" x="480" y="506">primitive mapping · materialization · introspection · secrets · removal · feature notes</text>
  <text class="caption" x="480" y="522">one pinned render in personal/ · symlinked into the harness · bookkeeping: lockfile · diff gate · personal/ git history</text>
  <g transform="translate(70, 530)">
    <text class="side" x="0"   y="12">Hermes · <tspan font-style="italic">profiles + cron/jobs.json</tspan></text>
    <text class="side" x="230" y="12">NanoClaw · <tspan font-style="italic">groups + DB tasks</tspan></text>
    <text class="side" x="440" y="12">OpenClaw · <tspan font-style="italic">agents + workspace files</tspan></text>
    <text class="side" x="0"   y="28">Nanobot · <tspan font-style="italic">agents/*.md + MCP</tspan></text>
    <text class="side" x="230" y="28">Claude Code · <tspan font-style="italic">skills + CronCreate</tspan></text>
    <text class="side" x="440" y="28" opacity="0.45">OpenCode <tspan font-style="italic">(later)</tspan></text>
  </g>

  <!-- Pages tier -->
  <text class="tier-label" x="30" y="598">PERSONALIZED INSTALLS <tspan class="atomic">· your version, in your harness</tspan></text>
  <g>
    <rect class="box page" x="30" y="610" width="270" height="46" rx="23"/>
    <text x="165" y="638" font-size="12" fill="white" text-anchor="middle" font-weight="700">Your stack · Hermes/NanoClaw/OpenClaw</text>
    <rect class="box page" x="330" y="610" width="220" height="46" rx="23" opacity="0.85"/>
    <text x="440" y="638" font-size="12" fill="white" text-anchor="middle" font-weight="700">Collaborator's harness</text>
    <rect class="box page" x="580" y="610" width="180" height="46" rx="23" opacity="0.7"/>
    <text x="670" y="638" font-size="12" fill="white" text-anchor="middle" font-weight="700">Any user</text>
  </g>

  <!-- Flows -->
  <path class="flow" d="M94 92 C 94 118, 105 128, 105 152" marker-end="url(#arr)"/>
  <path class="flow" d="M234 92 C 234 118, 300 128, 300 152" marker-end="url(#arr)"/>
  <path class="flow" d="M374 92 C 374 118, 480 128, 480 152" marker-end="url(#arr)"/>
  <path class="flow" d="M519 92 C 519 118, 625 128, 625 152" marker-end="url(#arr)"/>
  <path class="flow" d="M105 206 L 105 264" marker-end="url(#arr)"/>
  <path class="flow" d="M300 206 L 300 264" marker-end="url(#arr)"/>
  <path class="flow" d="M625 206 L 625 264" marker-end="url(#arr)"/>
  <path class="flow" d="M395 298 C 395 318, 200 322, 142 340" marker-end="url(#arr)"/>
  <path class="flow" d="M860 298 C 860 318, 520 322, 400 340" marker-end="url(#arr)"/>
  <path class="flow" d="M142 426 L 142 468" marker-end="url(#arr)"/>
  <path class="flow" d="M395 426 L 395 468" marker-end="url(#arr)"/>
  <path class="flow" d="M165 568 L 165 610" marker-end="url(#arr)"/>
  <path class="flow" d="M440 568 L 440 610" marker-end="url(#arr)"/>
  <path class="flow" d="M670 568 L 670 610" marker-end="url(#arr)"/>

  <text x="480" y="686" class="caption">shared repo ships templates · your harness runs pages · MOD.md is the difference</text>
  <text x="480" y="702" class="caption">aos (placeholder, RFC-001) · architecture v0.1 · 2026-07-29 · MIT</text>
</svg>
