[project]
name = "aos-kb"                  # kit name is RFC-001's; command below is what matters
version = "0.7.3"                # tracks the kb capability version
description = "Deterministic executor for aos kb bases (capability-shipped tool, ARCHITECTURE §2.4)"
# >=3.10, not >=3.9: two independent reasons converge on the same floor. First, the
# file already used bare `X | None` unions with no `from __future__ import
# annotations` — that raises TypeError at import time on a real 3.9 interpreter
# (PEP 604's type.__or__ landed in 3.10), so the >=3.9 claim was already false.
# Second, typer's command-registration inspects Annotated[...] type hints at
# runtime, which is incompatible with the future-import route that would otherwise
# let 3.9 stay honest. uv manages its own interpreter for `uv tool install`/`uvx`,
# so this costs an installing user nothing.
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "typer>=0.15"]

[project.scripts]
kb = "aos_kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aos_kb"]
