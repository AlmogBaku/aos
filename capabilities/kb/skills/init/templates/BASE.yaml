layout: 1                      # format generation — tools fail loudly on mismatch
name: {{name}}
audience: {{audience}}         # private | shared — mirrored in the registry; effective = most restrictive
methodology: karpathy-llm-wiki

# principals: who the humans are, on a base more than one of them writes to. Maps the
# git author email of a write to the subject the Grants table names. Base-side truth,
# so every member pulling the repo sees the same roster. Omit it entirely on a private
# base: with no roster every write is `user`, which is what the grants seed already
# says, and nothing changes.
# principals:
#   alice@example.com: user:alice
#   bob@example.com:   user:bob
purpose: >
  {{purpose}}

types: [person, company, product, concept, project, meeting, capture, clipping, note]
# Closed per-base vocabulary. Adding a type = edit this file FIRST (owner approval on
# shared bases), commit, then use.

zones:
  raw:      {kind: raw}
  entities: {kind: wiki, subdirs: [people, companies]}
  concepts: {kind: wiki}
  projects: {kind: wiki}
  profile:  {kind: wiki}
  _ops:     {kind: machinery}
  _archive: {kind: archive}
# Zone changes are schema changes (owner-approved). Deeper subdirectories are free —
# create them as needed, updating index.md in the same commit.

state:
  max_items: 20                # hard cap per state file; adding when full = evict first
  # A private base keeps one `state.yaml`. A shared base shards it to
  # `state/<principal>.yaml` — the attention window is one person's, and a single file
  # everyone rewrites in place is the one shape git cannot merge.

frontmatter:
  extensions: []               # per-base fields; a meta: field used by 2+ docs graduates here
