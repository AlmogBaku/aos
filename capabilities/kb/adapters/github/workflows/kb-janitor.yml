name: kb janitor

# The deterministic half of curation, and nothing else: no LLM, no API key, no secrets.
#
# It runs here rather than on someone's machine for two reasons. A base several people
# share otherwise has no neutral actor — whichever household runs the checks is also the
# one whose agent ends up reading everybody else's raw material. And on the plan a small
# team actually has, this is the only enforcement surface there is: GitHub gates
# rulesets, branch protection and CODEOWNERS to Pro/Team/Enterprise for private repos,
# while Actions minutes come with the free plan. You cannot block a bad push; you can
# fail it loudly, in front of everyone, every time.
#
# It answers no question about who *promotes* — that is curation, and it is still a
# human's job (or a household's). See ../README.md.

on:
  push:
  pull_request:
  schedule:
    # Weekly, deliberately off the hour: jobs on :00 all fire at once.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The grants audit reads git authorship over recent history, so a shallow
          # clone would silently audit nothing.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the base tool
        env:
          # Pin a fork or a tag by setting BASE_TOOL_SOURCE as a repository variable.
          SRC: ${{ vars.BASE_TOOL_SOURCE || 'git+https://github.com/AlmogBaku/aos@main#subdirectory=capabilities/kb/tool' }}
        run: uv tool install --from "$SRC" base

      - name: Lint the base
        # Report-only becomes a verdict here: exit 1 on any critical. Criticals are the
        # invariants a base cannot bend — an LLM-routed write in a shared base, a write
        # with no matching grant, a duplicate title, a backup file, a left-behind git
        # operation. Findings still print without failing the run.
        run: base --base . lint --ci --audit-days 30
