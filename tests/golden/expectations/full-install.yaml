# Structural expectations for the full capability-lifecycle+kb+work-tracker install into the
# aos-test profile namespace. Roots resolved by check.mjs:
#   front  = ~/.hermes/profiles/aos-test
#   <agent>= ~/.hermes/profiles/aos-<agent>
#   home   = <repo>/tests/.sandbox/aos-home  (the household: upstream/ + personal/ + .aos/)
# Every skill path below is an INSTALLED name (§2.5): `<skill_prefix><id>`, with the entry
# skill keeping the capability id. capability-lifecycle declares `capability-`, work-tracker
# declares `wt-`, kb takes the default `kb-`. `aos-lock skills <cap-dir>` is the authority.
agents: [archiver, steward]

expect_files:
  # capability-lifecycle — ten main-scoped skills, {{mod}}-slot-free. The entry skill
  # installs verbatim (no `capability-lifecycle-capability-lifecycle` stutter).
  - "front:skills/capability-lifecycle/SKILL.md"
  - "front:skills/capability-lifecycle/reference/contract.md"
  - "front:skills/capability-lifecycle/reference/naming.md"
  # the cheat-sheets travel with the render — that is the point of them being reference
  # files of the skill that reads them, rather than a capability-level directory
  - "front:skills/capability-lifecycle/reference/harness-hermes.md"
  - "front:skills/capability-lifecycle/reference/harness-nanoclaw.md"
  - "front:skills/capability-lifecycle/reference/harness-openclaw.md"
  - "front:skills/capability-lifecycle/reference/harness-nanobot.md"
  - "front:skills/capability-lifecycle/reference/harness-claude-code.md"
  - "front:skills/capability-lifecycle/reference/no-cheatsheet.md"
  - "front:skills/capability-install/SKILL.md"
  - "front:skills/capability-upgrade/SKILL.md"
  - "front:skills/capability-remove/SKILL.md"
  - "front:skills/capability-evolve/SKILL.md"
  # absorbed capabilities are now skills of this one (0.3.0)
  - "front:skills/capability-onboard/SKILL.md"
  - "front:skills/capability-onboard/reference/answer-validation.md"
  - "front:skills/capability-import/SKILL.md"
  - "front:skills/capability-build/SKILL.md"
  - "front:skills/capability-contribute/SKILL.md"
  - "front:skills/capability-review/SKILL.md"
  - "front:skills/capability-review/reference/skill-rubric.md"
  # kb main-scoped skills — entry skill travels with its bundled assets
  - "front:skills/kb/SKILL.md"
  - "front:skills/kb/reference/lifecycle.md"
  - "front:skills/kb-capture/SKILL.md"
  - "front:skills/kb-route/SKILL.md"
  - "front:skills/kb-recall/SKILL.md"
  - "front:skills/kb-init/SKILL.md"
  - "front:skills/kb-init/templates/base.yml"
  - "front:skills/kb-adopt/SKILL.md"
  - "front:skills/kb-import/SKILL.md"
  - "front:skills/kb-import/reference/v1-migration.md"
  # kb archiver-scoped: the entry skill (map + tool); lint is a tool verb now
  - "archiver:skills/kb/SKILL.md"
  - "archiver:SOUL.md"
  # work-tracker — entry skill goes to both main and steward (used_by: [main, steward])
  - "front:skills/work-tracker/SKILL.md"
  - "front:skills/work-tracker/reference/action-page.md"
  - "front:skills/wt-capture/SKILL.md"
  - "front:skills/wt-schedule/SKILL.md"
  - "front:skills/wt-update/SKILL.md"
  - "steward:skills/work-tracker/SKILL.md"
  - "steward:skills/work-tracker/reference/action-page.md"
  - "steward:skills/wt-steward/SKILL.md"
  - "steward:SOUL.md"
  # pinned renders — the canonical artifacts in personal/ that harness links target.
  # The render directory carries the installed name too: one identity end to end.
  - "home:personal/capabilities/capability-lifecycle/skills/capability-lifecycle/SKILL.md"
  - "home:personal/capabilities/capability-lifecycle/skills/capability-onboard/SKILL.md"
  - "home:personal/capabilities/kb/skills/kb/SKILL.md"
  - "home:personal/capabilities/work-tracker/skills/wt-capture/SKILL.md"
  - "home:personal/capabilities/work-tracker/skills/wt-steward/SKILL.md"
  # ledgers at mirrored paths in the personal root
  - "home:personal/MOD.md"
  - "home:personal/kb-registry.yaml"
  - "home:personal/capabilities/work-tracker/MOD.md"
  # bookkeeping — household-level lockfile
  - "home:.aos/installs.lock.yaml"

forbid_texts:
  # the harness owns user context (Hermes: memories/USER.md). aos must not distil the
  # global MOD's identity facts into an agent it did not create.
  - {text: "aos:capability-lifecycle:identity", in: "front:SOUL.md"}
  - {text: "aos:onboarding", in: "front:SOUL.md"}

forbid_files:
  # used_by placement — the anti-pollution rule, §2.2
  - "front:skills/wt-steward/SKILL.md"
  - "steward:skills/wt-capture/SKILL.md"
  - "steward:skills/wt-schedule/SKILL.md"
  - "archiver:skills/wt-capture/SKILL.md"
  - "archiver:skills/wt-steward/SKILL.md"
  - "archiver:skills/work-tracker/SKILL.md"
  # the retired `<capability>-<id>` link scheme — the entry-skill stutter especially
  - "front:skills/capability-lifecycle-capability-lifecycle/SKILL.md"
  - "front:skills/capability-lifecycle-capability-installer/SKILL.md"
  - "front:skills/kb-kb/SKILL.md"
  - "front:skills/onboarding-onboarding/SKILL.md"
  - "front:skills/work-tracker-work-tracker/SKILL.md"
  - "front:skills/work-tracker-capture/SKILL.md"
  # the retired capability-level cheat-sheet directory: a path that resolves in the source
  # tree and nowhere beside an installed skill
  - "home:personal/capabilities/capability-lifecycle/harnesses/hermes.md"
  # capabilities absorbed into capability-lifecycle must leave no separate footprint
  - "home:personal/capabilities/onboarding/CAPABILITY.md"
  - "home:personal/capabilities/importer/CAPABILITY.md"
  - "home:personal/capabilities/capability-builder/CAPABILITY.md"
  # dead artifacts from the pre-redesign anatomy — must not be materialized
  - "front:skills/kb-authz-check/SKILL.md"
  - "archiver:skills/kb-authz-check/SKILL.md"
  - "archiver:skills/kb-lint/SKILL.md"
  - "front:skills/work-tracker/sections/action-page.md"
  - "steward:skills/wt-steward/steward-prompt.md"
  - "front:skills/onboarding-interview/SKILL.md"
  - "front:skills/wt-format-entry/SKILL.md"

# Third-party skills this capability references rather than ships: linked from
# <home>/vendor/, never rendered, so no origin tag and no personal/ link target (§2.1).
vendored: [skill-creator]

# every materialized SKILL.md under these roots must carry the origin tag
origin_tag_roots: ["front:skills", "steward:skills", "archiver:skills"]

# cron jobs in aos-* profile homes must use the aos:<cap>:<id> name prefix;
# expected schedules with their owning profile. `sync` is an exec schedule —
# a script-only cron job (no agent invocation; the job runs the installed `kb`
# command directly).
schedules:
  - {profile: steward, name_prefix: "aos:work-tracker:nightly-steward"}
  - {profile: archiver, name_prefix: "aos:kb:nightly-promote"}
  - {profile: archiver, name_prefix: "aos:kb:weekly-maintain"}
  - {profile: archiver, name_prefix: "aos:kb:sync"}

sentinels:
  - {text: "🦜", in: "front:skills/wt-capture/SKILL.md"}
  # the MARS mode boundary is the ONE block aos writes to the front agent's identity file
  - {text: "aos:capability-lifecycle:mode-boundary", in: "front:SOUL.md"}
  # the sync wrapper must pin the household's registry — a bare `kb sync` silently no-ops
  # (the wrapper's canonical home is the harness scripts dir, recorded in the lockfile;
  # the profile-level copy is what this root can see)
  - {text: "kb-registry.yaml", in_dir: "archiver:scripts"}
  # steward_hour 22:47 → cron expression "47 22 * * *" in the steward's jobs
  - {text: "47 22", in_dir: "steward:cron"}
  # The global MOD's sacred time must reach the schedule-touching agent. Matched on the
  # distinctive token, not the fixture's phrasing: the contract says *distill* the identity
  # facts, so the render legitimately rewords them ("Thursday choir practice, 19:00–21:00").
  # A verbatim assertion here would contradict the contract it is testing.
  - {text: "choir", in_dir: "steward:"}
  # …and the time fact itself, so the sentinel keeps its signal
  - {text: "19:00", in_dir: "steward:"}
  # exec schedule: the sync job's command must invoke the tool, not an agent prompt
  - {text: "kb sync --all", in_dir: "archiver:"}

# every capability's lockfile entry must carry links whose targets are in personal/
# (the snapshot-mode proxy for the symlink contract — snapshots dereference links)
lockfile_links_into_personal: true

# live-only: harness skill dirs must be symlinks into personal/ (§5.3 — copies banned)
expect_links:
  - "front:skills/capability-install"
  - "front:skills/kb"
  - "front:skills/wt-capture"
  - "steward:skills/wt-steward"
  - "archiver:skills/kb"

lockfile_capabilities: [capability-lifecycle, kb, work-tracker]
