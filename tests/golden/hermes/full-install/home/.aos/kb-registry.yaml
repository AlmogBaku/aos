default: personal-kb
confidence_bar: 0.7
kbs:
- name: personal-kb
  tag: personal
  path: ~/aos/upstream/tests/.sandbox/kb/personal-kb
  remote: null
  sync: none
  audience: private
  purpose: 'Dana''s personal knowledge: life admin, ideas, people they know personally,
    hobbies (choir, reading), household, health. When in doubt, it goes here.'
  routing:
    channels:
    - whatsapp:+<ID>
    keywords:
    - choir
    - family
    - home
- name: acme-kb
  tag: work
  path: ~/aos/upstream/tests/.sandbox/kb/acme-kb
  remote: null
  sync: none
  audience: shared
  purpose: 'Acme Corp''s shared work KB: clients, projects, tickets, meeting notes.
    Shared with colleagues — only explicit or rule-matched writes.'
  routing:
    channels: []
    keywords:
    - acme
    - client
    - ticket
    - sprint
- name: commitments
  tag: commitments
  path: <HOME>/aos/upstream/tests/.sandbox/kb/commitments
  remote: null
  sync: manual
  audience: private
  purpose: 'Commitments Dana has to keep personally — next actions, things waiting
    on other people, someday items. A personal backlog, never knowledge: what was
    learned goes to personal-kb.'
  routing:
    channels: []
    keywords: []
