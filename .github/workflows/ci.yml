name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version-bump check diffs against the base
      # uv is the only prerequisite: the whole toolchain (tier-0 tools, tier-1 lint, tier-2
      # goldens) is Python, so there is no Node setup and no npm ci.
      - uses: astral-sh/setup-uv@v5
      - name: tier-0 capability tool tests + example-base fixture
        run: |
          uv run --quiet tests/tool/test_kb.py
          uv run --quiet tests/tool/test_cap.py
          # Pinned: the runner has no git identity, so the tool would synthesize
          # `runner@<host>.local` and the weak-principal check would fire on the RUNNER
          # rather than on the fixture. See the same comment in tools/check.sh.
          AOS_PRINCIPAL_ID=dana@example.com \
          uv run --quiet --project capabilities/kb/tool kb \
            --base tests/fixtures/example-base lint | tee /tmp/example-lint.txt
          grep -q "Critical (0)" /tmp/example-lint.txt
          grep -q "Findings (0)" /tmp/example-lint.txt
      - name: tier-1 lint
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="--base origin/${{ github.base_ref }}"
          fi
          uv run --quiet --project tools/aos_lint python -m aos_lint.cli $BASE
      - name: lint selftest
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.selftest
      - name: retired-token gate
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.gates.retired
      - name: coverage gate
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.gates.coverage
      - name: kb documented-command check
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.gates.kb_commands
      - name: privacy gate
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.gates.privacy
      - name: golden structural checks
        run: uv run --quiet --project tools/aos_lint python -m aos_lint.golden.check
